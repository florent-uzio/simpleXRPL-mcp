name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing (OIDC): no npm token is stored in the repo.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships with.
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # With pending changesets this opens a "Version Packages" PR; once that PR is merged it publishes.
      # npm publish runs the prepublishOnly guard (format, types, tests including the packed-tarball check).
      # v2 is needed with Changesets v3: v1 cannot see the tags v3 creates, so it pushes no tags and creates no releases.
      - name: Open the release PR or publish
        uses: changesets/action@v2
        with:
          publish-script: npm run release
